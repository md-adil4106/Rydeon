{% extends "base.html" %}

{% block title %}Internal Server Error | Rydeon Vehicle Rental{% endblock %}

{% block content %}
<div class="container py-5 text-center min-vh-50 d-flex flex-column justify-content-center align-items-center">
    <div class="p-4 bg-danger-subtle rounded-circle text-danger mb-3" style="width: 80px; height: 80px; display: inline-flex; align-items: center; justify-content: center;">
        <i class="bi bi-exclamation-triangle-fill fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark">500 - Server Encountered An Issue</h1>
    <p class="lead text-secondary max-w-500 mb-4">An unexpected internal condition occurred. Our technical staff has been notified.</p>
    <a href="{{ url_for('frontend.index') }}" class="btn btn-primary-rydeon px-4 py-2">
        <i class="bi bi-arrow-clockwise me-1"></i> Return to Safety
    </a>
</div>
{% endblock %}
