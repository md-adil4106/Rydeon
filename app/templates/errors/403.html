{% extends "base.html" %}

{% block title %}403 Forbidden | Rydeon Vehicle Rental{% endblock %}

{% block content %}
<div class="container py-5 text-center min-vh-50 d-flex flex-column justify-content-center align-items-center">
    <div class="p-4 bg-danger-subtle rounded-circle text-danger mb-3" style="width: 80px; height: 80px; display: inline-flex; align-items: center; justify-content: center;">
        <i class="bi bi-shield-slash-fill fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark">403 - Access Forbidden</h1>
    <p class="lead text-secondary max-w-500 mb-4">
        You do not possess the required administrator credentials to view this protected resource.
    </p>
    <div class="d-flex gap-2">
        <a href="{{ url_for('frontend.dashboard') }}" class="btn btn-primary-rydeon px-4 py-2">
            <i class="bi bi-person-circle me-1"></i> My Dashboard
        </a>
        <a href="{{ url_for('frontend.index') }}" class="btn btn-outline-secondary px-4 py-2">
            Return to Home
        </a>
    </div>
</div>
{% endblock %}
